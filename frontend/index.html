<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miah</title>

  <style>
    :root {
      --bg: #212121;
      --sidebar: #171717;
      --panel: #2f2f2f;
      --border: #3a3a3a;
      --text: #ececec;
      --muted: #a0a0a0;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* AUTH */

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: var(--sidebar);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .auth-logo,
    .welcome-logo,
    .avatar,
    .message-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: white;
      color: #171717;
      font-size: 24px;
      font-weight: 800;
    }

    .auth-card h1 {
      margin: 0;
      text-align: center;
      font-size: 30px;
    }

    .auth-subtitle {
      margin: 8px 0 24px;
      text-align: center;
      color: var(--muted);
    }

    .auth-input {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #212121;
      color: var(--text);
      outline: none;
    }

    .primary-btn,
    .secondary-btn {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 10px;
    }

    .primary-btn {
      border: 0;
      background: white;
      color: #171717;
      font-weight: 700;
    }

    .secondary-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    .auth-message {
      min-height: 22px;
      margin-top: 12px;
      color: #fca5a5;
      font-size: 14px;
    }

    /* APP */

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 260px;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
    }

    .sidebar-top {
      padding: 12px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      text-align: left;
    }

    .sidebar-label {
      padding: 18px 14px 8px;
      color: #777;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .sidebar-chat {
      margin: 0 8px;
      padding: 10px 12px;
      border-radius: 8px;
    }

    .sidebar-chat.active {
      background: #2f2f2f;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 10px;
      border-top: 1px solid var(--border);
    }

    .sidebar-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: white;
      color: #171717;
      font-weight: 800;
    }
