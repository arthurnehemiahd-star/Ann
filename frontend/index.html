<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Miah — Personal AI Assistant</title>

  <style>
    :root {
      --bg: #212121;
      --sidebar: #171717;
      --panel: #2f2f2f;
      --border: #3a3a3a;
      --text: #ececec;
      --muted: #a0a0a0;
      --white: #ffffff;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: var(--sidebar);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: white;
      color: #171717;

      border-radius: 16px;

      font-size: 25px;
      font-weight: 800;
    }

    .auth-card h1 {
      text-align: center;
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin: 8px 0 28px;
    }

    .auth-card h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .auth-input {
      width: 100%;
      padding: 13px 14px;

      margin-top: 10px;

      border: 1px solid var(--border);
      border-radius: 10px;

      outline: none;

      background: #212121;
      color: var(--text);
    }

    .auth-input:focus {
      border-color: #777;
    }

    .primary-btn,
    .secondary-btn {
      width: 100%;
      padding: 13px;
      margin-top: 12px;

      border-radius: 10px;

      font-weight: 700;
    }

    .primary-btn {
      border: 0;
      background: white;
      color: #171717;
    }

    .secondary-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    .auth-message {
      min-height: 22px;
      margin-top: 12px;

      color: #fca5a5;
      font-size: 14px;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      height: 100vh;

      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      flex-shrink: 0;

      display: flex;
      flex-direction: column;

      background: var(--sidebar);
      border-right: 1px solid var(--border);
    }

    .sidebar-top {
      padding: 12px;
    }

    .new-chat {
      width: 100%;
      padding: 11px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: transparent;
      color: var(--text);
    }

    .sidebar-title {
      padding: 18px 14px 8px;

      color: #777;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .chat-item {
      margin: 0 8px;
      padding: 10px 12px;

      border-radius: 8px;
      background: #2f2f2f;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 12px;

      border-top: 1px solid var(--border);
    }

    .user-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 9px;

      background: white;
      color: #171717;

      font-weight: 800;
    }

    .user-name {
      flex: 1;
    }

    .settings-btn {
      border: 0;
      background: transparent;
      color: var(--muted);

      font-size: 18px;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      min-width: 0;
      flex: 1;

      display: flex;
      flex-direction: column;

      background: var(--bg);
    }

    .chat-header {
      height: 58px;
      flex-shrink: 0;

      display: flex;
      align-items: center;

      padding: 0 20px;

      border-bottom: 1px solid var(--border);
    }

    .chat-header-title {
      font-weight: 700;
    }

    .messages {
      flex: 1;
      overflow-y: auto;

      padding: 30px 20px 150px;
    }

    .welcome {
      min-height: 65vh;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .welcome-inner {
      max-width: 700px;
    }

    .welcome-logo {
      width: 65px;
      height: 65px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 20px;

      background: white;
      color: #171717;

      border-radius: 18px;

      font-size: 28px;
      font-weight: 800;
    }

    .welcome h1 {
      margin-bottom: 10px;
      font-size: 34px;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.6;
    }

    .message-row {
      display: flex;
      margin: 10px 0;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: 820px;

      padding: 10px 14px;

      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user {
      background: #2f2f2f;
      border-radius: 18px;
    }

    .message.assistant {
      background: transparent;
    }

    .message-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-area {
      position: fixed;

      left: 260px;
      right: 0;
      bottom: 0;

      padding: 12px 20px 18px;

      background: linear-gradient(
        to bottom,
        rgba(33,33,33,0),
        var(--bg) 30%
      );
    }

    .composer {
      width: min(820px, 100%);
      margin: auto;

      display: flex;
      align-items: flex-end;
      gap: 10px;

      padding: 10px;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: var(--panel);
    }

    .message-input {
      flex: 1;

      min-height: 44px;
      max-height: 160px;

      resize: none;

      border: 0;
      outline: 0;

      background: transparent;
      color: var(--text);

      padding: 11px 8px;
    }

    .send-btn {
      width: 42px;
      height: 42px;

      border: 0;
      border-radius: 12px;

      background: white;
      color: #171717;

      font-size: 18px;
      font-weight: 800;
    }

    .send-btn:disabled {
      opacity: .4;
    }

    .note {
      text-align: center;
      margin-top: 7px;

      color: #707070;
      font-size: 11px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {

      .sidebar {
        display: none;
      }

      .composer-area {
        left: 0;
        padding-left: 10px;
        padding-right: 10px;
      }

      .messages {
        padding-left: 12px;
        padding-right: 12px;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

  <!-- SETUP -->
  <section id="setup-screen" class="auth-screen hidden">
    <div class="auth-card">

      <div class="logo">M</div>

      <h1>Miah</h1>

      <div class="subtitle">
        Your personal AI assistant
      </div>

      <h2>Create your password</h2>

      <input
        id="setup-password"
        class="auth-input"
        type="password"
        placeholder="Create password"
      >

      <button
        id="setup-button"
        class="primary-btn"
      >
        Create Password
      </button>

      <div
        id="setup-message"
        class="auth-message"
      ></div>

    </div>
  </section>


  <!-- LOGIN -->
  <section id="login-screen" class="auth-screen hidden">
    <div class="auth-card">

      <div class="logo">M</div>

      <h1>Miah</h1>

      <div class="subtitle">
        Your personal AI assistant
      </div>

      <h2>Welcome back</h2>

      <input
        id="login-password"
        class="auth-input"
        type="password"
        placeholder="Password"
      >

      <button
        id="login-button"
        class="primary-btn"
      >
        Log In
      </button>

      <button
        id="forgot-button"
        class="secondary-btn"
      >
        Forgot password?
      </button>

      <div
        id="login-message"
        class="auth-message"
      ></div>

    </div>
  </section>


  <!-- APP -->
  <section id="app-screen" class="app hidden">

    <aside class="sidebar">

      <div class="sidebar-top">

        <button
          id="new-chat-button"
          class="new-chat"
        >
          ＋ New chat
        </button>

      </div>

      <div class="sidebar-title">
        Chats
      </div>

      <div class="chat-item">
        Miah
      </div>

      <div class="sidebar-bottom">

        <div class="user-box">

          <div class="avatar">
            M
          </div>

          <div class="user-name">
            Miah
          </div>

          <button
            id="logout-button"
            class="settings-btn"
            title="Log out"
          >
            ↪
          </button>

        </div>

      </div>

    </aside>


    <main class="chat">

      <header class="chat-header">
        <div class="chat-header-title">
          Miah
        </div>
      </header>


      <div
        id="messages"
        class="messages"
      >

        <div
          id="welcome"
          class="welcome"
        >

          <div class="welcome-inner">

            <div class="welcome-logo">
              M
            </div>

            <h1>
              How can I help you?
            </h1>

            <p>
              I'm Miah, your personal AI assistant.
              Start a conversation below.
            </p>

          </div>

        </div>

      </div>


      <div class="composer-area">

        <form
          id="chat-form"
          class="composer"
        >

          <textarea
            id="message-input"
            class="message-input"
            rows="1"
            placeholder="Message Miah..."
            autocomplete="off"
          ></textarea>

          <button
            id="send-button"
            class="send-btn"
            type="submit"
          >
            ↑
          </button>

        </form>

        <div class="note">
          Miah can make mistakes. Check important information.
        </div>

      </div>

    </main>

  </section>


  <script>

    /* =========================
       CONFIG
    ========================= */

    const API_BASE_URL =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1"
        ? "http://localhost:3000"
        : "https://kenzi.onrender.com";


    const PASSWORD_KEY = "miah_password";


    /* =========================
       ELEMENTS
    ========================= */

    const setupScreen =
      document.getElementById("setup-screen");

    const loginScreen =
      document.getElementById("login-screen");

    const appScreen =
      document.getElementById("app-screen");

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("message-input");

    const sendButton =
      document.getElementById("send-button");


    /* =========================
       SCREEN
    ========================= */

    function showScreen(screen) {

      setupScreen.classList.add("hidden");
      loginScreen.classList.add("hidden");
      appScreen.classList.add("hidden");

      screen.classList.remove("hidden");
    }


    function setMessage(id, text) {

      document.getElementById(id).textContent =
        text || "";
    }


    /* =========================
       PASSWORD
    ========================= */

    function savePassword(password) {
      localStorage.setItem(
        PASSWORD_KEY,
        password
      );
    }


    function getPassword() {
      return localStorage.getItem(
        PASSWORD_KEY
      );
    }


    function clearPassword() {
      localStorage.removeItem(
        PASSWORD_KEY
      );
    }


    function authHeader(password) {

      return "Basic " +
        btoa(":" + password);
    }


    /* =========================
       API STATUS
    ========================= */

    async function getAuthStatus() {

      const response =
        await fetch(
          API_BASE_URL +
          "/api/auth-status"
        );

      if (!response.ok) {
        throw new Error(
          "Backend is unavailable."
        );
      }

      return response.json();
    }


    /* =========================
       INITIALIZE
    ========================= */

    async function initialize() {

      try {

        const status =
          await getAuthStatus();

        const savedPassword =
          getPassword();

        if (savedPassword) {

          const response =
            await fetch(
              API_BASE_URL +
              "/api/dashboard",
              {
                headers: {
                  Authorization:
                    authHeader(
                      savedPassword
                    )
                }
              }
            );

          if (response.ok) {

            showScreen(appScreen);

            return;
          }

          clearPassword();
        }


        if (status.needsSetup) {

          showScreen(setupScreen);

        } else {

          showScreen(loginScreen);

        }

      } catch (error) {

        showScreen(loginScreen);

        setMessage(
          "login-message",
          "Cannot connect to Miah backend."
        );

      }
    }


    /* =========================
       SETUP
    ========================= */

    async function setupPassword() {

      const password =
        document
          .getElementById("setup-password")
          .value
          .trim();

      if (!password) {

        setMessage(
          "setup-message",
          "Enter a password."
        );

        return;
      }

      try {

        const response =
          await fetch(
            API_BASE_URL +
            "/api/setup-password",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  password
                })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Could not create password."
          );
        }

        savePassword(password);

        showScreen(appScreen);

        messageInput.focus();

      } catch (error) {

        setMessage(
          "setup-message",
          error.message
        );
      }
    }


    /* =========================
       LOGIN
    ========================= */

    async function login() {

      const password =
        document
          .getElementById("login-password")
          .value
          .trim();

      if (!password) {

        setMessage(
          "login-message",
          "Enter your password."
        );

        return;
      }

      try {

        const response =
          await fetch(
            API_BASE_URL +
            "/api/dashboard",
            {
              headers: {
                Authorization:
                  authHeader(password)
              }
            }
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Incorrect password."
          );
        }

        savePassword(password);

        document
          .getElementById("login-password")
          .value = "";

        showScreen(appScreen);

        messageInput.focus();

      } catch (error) {

        setMessage(
          "login-message",
          error.message
        );
      }
    }


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

      clearPassword();

      messages.innerHTML = "";

      addWelcome();

      showScreen(loginScreen);
    }


    /* =========================
       WELCOME
    ========================= */

    function addWelcome() {

      messages.innerHTML = `

        <div
          id="welcome"
          class="welcome"
        >

          <div class="welcome-inner">

            <div class="welcome-logo">
              M
            </div>

            <h1>
              How can I help you?
            </h1>

            <p>
              I'm Miah, your personal AI assistant.
              Start a conversation below.
            </p>

          </div>

        </div>
      `;
    }


    /* =========================
       MESSAGE
    ========================= */

    function addMessage(
      role,
      text
    ) {

      const welcome =
        document.getElementById(
          "welcome"
        );

      if (welcome) {
        welcome.remove();
      }


      const row =
        document.createElement("div");

      row.className =
        "message-row " + role;


      const message =
        document.createElement("div");

      message.className =
        "message " + role;


      const name =
        document.createElement("div");

      name.className =
        "message-name";

      name.textContent =
        role === "assistant"
          ? "Miah"
          : "You";


      const body =
        document.createElement("div");

      body.textContent = text;


      message.appendChild(name);
      message.appendChild(body);

      row.appendChild(message);

      messages.appendChild(row);

      messages.scrollTop =
        messages.scrollHeight;
    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const text =
        messageInput.value.trim();

      if (!text) {
        return;
      }


      const password =
        getPassword();

      if (!password) {

        logout();

        return;
      }


      addMessage(
        "user",
        text
      );


      messageInput.value = "";

      sendButton.disabled = true;


      try {

        const response =
          await fetch(
            API_BASE_URL +
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                Authorization:
                  authHeader(password)
              },

              body:
                JSON.stringify({
                  message: text
                })
            }
          );


        const data =
          await response.json();


        if (
          response.status === 401 ||
          response.status === 403
        ) {

          clearPassword();

          logout();

          return;
        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Miah could not respond."
          );
        }


        addMessage(
          "assistant",
          data.reply ||
          "I received your message."
        );

      } catch (error) {

        addMessage(
          "assistant",
          "Sorry, I could not connect to the Miah backend."
        );

        console.error(error);

      } finally {

        sendButton.disabled = false;

        messageInput.focus();
      }
    }


    /* =========================
       NEW CHAT
    ========================= */

    document
      .getElementById("new-chat-button")
      .addEventListener(
        "click",
        () => {
          addWelcome();
        }
      );


    /* =========================
       EVENTS
    ========================= */

    document
      .getElementById("setup-button")
      .addEventListener(
        "click",
        setupPassword
      );


    document
      .getElementById("login-button")
      .addEventListener(
        "click",
        login
      );


    document
      .getElementById("logout-button")
      .addEventListener(
        "click",
        logout
      );


    document
      .getElementById("chat-form")
      .addEventListener(
        "submit",
        event => {

          event.preventDefault();

          sendMessage();
        }
      );


    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();
        }
      }
    );


    /* =========================
       START
    ========================= */

    initialize();

  </script>

</body>
</html>
