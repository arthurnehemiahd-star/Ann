services:
  - type: web
    name: ann-bot-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: NETLIFY_SITE_URL
        fromDatabase:
          name: NETLIFY_SITE_URL
