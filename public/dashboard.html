<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANN Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      .container {
        max-width: 960px;
        margin: 40px auto;
        padding: 24px;
      }
      .card {
        background: #111827;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }
      h1, h2 {
        margin-top: 0;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }
      .stat {
        background: #1e293b;
        padding: 16px;
        border-radius: 10px;
      }
      ul {
        padding-left: 20px;
      }
      .login-box {
        max-width: 420px;
        margin: 60px auto;
      }
      input, button {
        width: 100%;
        box-sizing: border-box;
        margin-top: 10px;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #475569;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
      }
      .hidden {
        display: none;
      }
      .small {
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="login-view" class="container login-box">
      <div class="card">
        <h1 id="auth-title">Private Access</h1>
        <p id="auth-message">Enter the dashboard password.</p>
        <input id="password-input" type="password" placeholder="Password" />
        <button id="login-button">Continue</button>

        <div id="recovery-box" class="card" style="margin-top: 16px; display: none;">
          <h2>Forgot password?</h2>
          <input id="recovery-email" type="email" placeholder="Your Gmail address" />
          <button id="send-code-button">Send verification code</button>
          <input id="recovery-code" type="text" placeholder="Enter code" style="margin-top: 12px;" />
          <input id="reset-new-password" type="password" placeholder="New password" style="margin-top: 12px;" />
          <button id="reset-password-button" style="margin-top: 12px;">Reset password</button>
          <div id="recovery-status" class="small"></div>
        </div>

        <button id="show-recovery-button" style="margin-top: 12px; background: #475569;">Forgot password?</button>
      </div>
    </div>

    <div id="dashboard-view" class="container hidden">
      <h1>ANN Dashboard</h1>

      <div class="card">
        <h2>Change Password</h2>
        <input id="current-password" type="password" placeholder="Current password" />
        <input id="new-password" type="password" placeholder="New password" />
        <button id="change-password-button">Update Password</button>
        <div id="password-status" class="small"></div>
      </div>

      <div class="stats">
        <div class="card stat">
          <h2>Messages</h2>
          <div id="message-count">Loading...</div>
        </div>
        <div class="card stat">
          <h2>Memory</h2>
          <div id="memory-count">Loading...</div>
        </div>
        <div class="card stat">
          <h2>Sessions</h2>
          <div id="session-count">Loading...</div>
        </div>
      </div>

      <div class="card">
        <h2>Recent Messages</h2>
        <ul id="recent-messages"></ul>
      </div>

      <div class="card">
        <h2>Memory</h2>
        <ul id="memory-items"></ul>
      </div>
    </div>

    <script>
      const loginView = document.getElementById('login-view');
      const dashboardView = document.getElementById('dashboard-view');
      const passwordInput = document.getElementById('password-input');
      const loginButton = document.getElementById('login-button');
      const authTitle = document.getElementById('auth-title');
      const authMessage = document.getElementById('auth-message');
      const currentPasswordInput = document.getElementById('current-password');
      const newPasswordInput = document.getElementById('new-password');
      const passwordStatus = document.getElementById('password-status');
      const recoveryBox = document.getElementById('recovery-box');
      const recoveryStatus = document.getElementById('recovery-status');

      function setAuthHeader(password) {
        const encoded = btoa(`ann:${password}`);
        return `Basic ${encoded}`;
      }

      async function loadAuthStatus() {
        const response = await fetch('/api/auth-status');
        const data = await response.json();
        return data;
      }

      async function openDashboard(password) {
        const response = await fetch('/api/dashboard', {
          headers: {
            Authorization: setAuthHeader(password),
          },
        });

        if (response.status === 401) {
          return { ok: false, message: 'Wrong password.' };
        }

        if (response.status === 403) {
          return { ok: false, message: 'Set your password first.' };
        }

        const data = await response.json();
        document.getElementById('message-count').textContent = data.messageCount;
        document.getElementById('memory-count').textContent = data.memoryCount;
        document.getElementById('session-count').textContent = data.sessionCount;

        const recent = document.getElementById('recent-messages');
        recent.innerHTML = (data.recentMessages || []).map((item) => 
          `<li><strong>${item.sender}</strong>: ${item.text}</li>`
        ).join('');

        const memory = document.getElementById('memory-items');
        memory.innerHTML = (data.memory || []).map((item) => 
          `<li><strong>${item.key}</strong>: ${item.value}</li>`
        ).join('');

        return { ok: true };
      }

      async function handleLogin() {
        const password = passwordInput.value.trim();
        const status = await loadAuthStatus();

        if (!status.configured) {
          const setupResponse = await fetch('/api/setup-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });
          const setupData = await setupResponse.json();

          if (!setupResponse.ok) {
            alert(setupData.error || 'Could not set the password.');
            return;
          }

          authTitle.textContent = 'Private Access';
          authMessage.textContent = 'Password created successfully. Sign in now.';
          passwordInput.value = '';
          return;
        }

        const result = await openDashboard(password);
        if (!result.ok) {
          alert(result.message || 'Access denied.');
          return;
        }

        loginView.classList.add('hidden');
        dashboardView.classList.remove('hidden');
      }

      loginButton.addEventListener('click', handleLogin);
      passwordInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          handleLogin();
        }
      });

      document.getElementById('change-password-button').addEventListener('click', async () => {
        const currentPassword = currentPasswordInput.value.trim();
        const newPassword = newPasswordInput.value.trim();
        const response = await fetch('/api/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: setAuthHeader(currentPassword),
          },
          body: JSON.stringify({ currentPassword, newPassword }),
        });
        const result = await response.json();

        if (!response.ok) {
          passwordStatus.textContent = result.error || 'Password change failed.';
          return;
        }

        passwordStatus.textContent = result.message || 'Password changed.';
        currentPasswordInput.value = '';
        newPasswordInput.value = '';
      });

      document.getElementById('show-recovery-button').addEventListener('click', () => {
        recoveryBox.style.display = recoveryBox.style.display === 'none' ? 'block' : 'none';
      });

      document.getElementById('send-code-button').addEventListener('click', async () => {
        const email = document.getElementById('recovery-email').value.trim();
        const response = await fetch('/api/request-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const result = await response.json();
        recoveryStatus.textContent = result.message || result.error || 'Could not send code.';
      });

      document.getElementById('reset-password-button').addEventListener('click', async () => {
        const email = document.getElementById('recovery-email').value.trim();
        const code = document.getElementById('recovery-code').value.trim();
        const newPassword = document.getElementById('reset-new-password').value.trim();

        const response = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code, newPassword }),
        });
        const result = await response.json();
        recoveryStatus.textContent = result.message || result.error || 'Could not reset password.';

        if (response.ok) {
          document.getElementById('recovery-email').value = '';
          document.getElementById('recovery-code').value = '';
          document.getElementById('reset-new-password').value = '';
        }
      });

      (async function initialize() {
        const status = await loadAuthStatus();
        if (!status.configured) {
          authTitle.textContent = 'Create Your Password';
          authMessage.textContent = 'This is your first time. Choose a password to secure the dashboard.';
          return;
        }

        authTitle.textContent = 'Private Access';
        authMessage.textContent = 'Enter your password to open the dashboard.';
      })();
    </script>
  </body>
</html>
